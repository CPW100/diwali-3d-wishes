<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Diwali 3D Wishes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: #05020a;
      color: #fff;
    }
    #canvas-container {
      width: 100%;
      height: 100vh;
      height: 100svh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      height: 100svh;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-top: 10px;
      text-shadow: 0 0 15px rgba(255, 180, 50, 0.8), 0 0 30px rgba(255, 100, 0, 0.6);
    }
    .header h1 {
      font-size: 2.5rem;
      color: #ffd700;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }
    .header p {
      font-size: 1.1rem;
      color: #ffaa44;
    }
    .controls-panel {
      pointer-events: auto;
      background: rgba(15, 5, 25, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.4);
      padding: 12px 24px;
      border-radius: 30px;
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 25px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }
    .btn {
      background: linear-gradient(135deg, #ff8c00, #ff0055);
      border: none;
      color: white;
      padding: 12px 24px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 140, 0, 0.4);
      pointer-events: auto;
      touch-action: manipulation;
    }
    .btn:active {
      transform: scale(0.96);
      box-shadow: 0 2px 10px rgba(255, 140, 0, 0.7);
    }
    @media (max-width: 600px) {
      .header h1 { font-size: 1.8rem; }
      .header p { font-size: 0.95rem; }
      .controls-panel { margin-bottom: 35px; }
      .btn { padding: 14px 28px; font-size: 1.05rem; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div class="ui-overlay">
    <div class="header">
      <h1>🪔 Happy Diwali 🪔</h1>
      <p>Wishing you light, joy, and prosperity!</p>
    </div>

    <div class="controls-panel">
      <button class="btn" id="lightup-btn" onclick="triggerGrandCelebration()">Grand Light Up 🪔</button>
    </div>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05020a, 0.03);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 10);
    camera.lookAt(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x221133, 1.5);
    scene.add(ambientLight);

    const goldLight = new THREE.PointLight(0xffaa00, 2, 20);
    goldLight.position.set(0, 4, 2);
    scene.add(goldLight);

    function createDiya() {
      const diyaGroup = new THREE.Group();

      const points = [];
      for (let i = 0; i <= 10; i++) {
        const x = Math.sin(i * 0.15) * 1.5 + 0.1;
        const y = (i * 0.12) - 0.5;
        points.push(new THREE.Vector2(x, y));
      }
      const bowlGeo = new THREE.LatheGeometry(points, 32);
      const bowlMat = new THREE.MeshStandardMaterial({
        color: 0xcd7f32,
        metalness: 0.7,
        roughness: 0.3,
        emissive: 0x331100
      });
      const bowl = new THREE.Mesh(bowlGeo, bowlMat);
      bowl.scale.set(1, 0.7, 1);
      diyaGroup.add(bowl);

      const flameGeo = new THREE.ConeGeometry(0.35, 1.2, 16);
      const flameMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
      const flame = new THREE.Mesh(flameGeo, flameMat);
      flame.position.set(0, 0.5, 0);
      diyaGroup.add(flame);

      const flameLight = new THREE.PointLight(0xff7700, 3, 8);
      flameLight.position.set(0, 0.6, 0);
      diyaGroup.add(flameLight);

      return { group: diyaGroup, flame: flame, light: flameLight };
    }

    const mainDiya = createDiya();
    mainDiya.group.position.set(0, 0, 0);
    scene.add(mainDiya.group);

    const floorGeo = new THREE.PlaneGeometry(30, 30);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a0314, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.6;
    scene.add(floor);

    const particleCount = 180;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 20;
      positions[i + 1] = Math.random() * 10;
      positions[i + 2] = (Math.random() - 0.5) * 20;

      colors[i] = 1.0;
      colors[i + 1] = 0.6 + Math.random() * 0.4;
      colors[i + 2] = 0.1;
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const particleMat = new THREE.PointsMaterial({
      size: 0.15,
      vertexColors: true,
      transparent: true,
      opacity: 0.8
    });
    const sparkles = new THREE.Points(particleGeo, particleMat);
    scene.add(sparkles);

    let fireworks = [];
    function triggerFireworks() {
      const count = 50;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const vel = [];
      
      const originX = (Math.random() - 0.5) * 10;
      const originY = 3 + Math.random() * 4;
      const originZ = (Math.random() - 0.5) * 6;
      const color = new THREE.Color().setHSL(Math.random(), 1, 0.6);

      for (let i = 0; i < count; i++) {
        pos[i * 3] = originX;
        pos[i * 3 + 1] = originY;
        pos[i * 3 + 2] = originZ;

        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        const speed = 0.05 + Math.random() * 0.08;

        vel.push({
          x: Math.sin(phi) * Math.cos(theta) * speed,
          y: Math.cos(phi) * speed,
          z: Math.sin(phi) * Math.sin(theta) * speed
        });
      }

      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({ size: 0.12, color: color, transparent: true });
      const pSystem = new THREE.Points(geo, mat);
      scene.add(pSystem);

      fireworks.push({ system: pSystem, vel: vel, life: 1.0 });
    }

    let lanterns = [];
    function spawnLantern() {
      const lanternGroup = new THREE.Group();
      const bodyGeo = new THREE.CylinderGeometry(0.2, 0.25, 0.5, 8);
      const bodyMat = new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.85 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      lanternGroup.add(body);

      const light = new THREE.PointLight(0xffaa00, 1.5, 3);
      lanternGroup.add(light);

      lanternGroup.position.set((Math.random() - 0.5) * 12, -1, (Math.random() - 0.5) * 10 - 2);
      scene.add(lanternGroup);

      lanterns.push({
        group: lanternGroup,
        speed: 0.02 + Math.random() * 0.02,
        sway: Math.random() * 10
      });
    }

    function triggerGrandCelebration() {
      for (let i = 0; i < 6; i++) {
        setTimeout(triggerFireworks, i * 200);
      }
      for (let i = 0; i < 5; i++) {
        setTimeout(spawnLantern, i * 300);
      }
      
      let flashCount = 0;
      const interval = setInterval(() => {
        mainDiya.light.intensity = flashCount % 2 === 0 ? 8 : 2.5;
        flashCount++;
        if (flashCount > 5) clearInterval(interval);
      }, 100);
    }

    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      mainDiya.group.rotation.y = time * 0.5;
      mainDiya.flame.scale.x = 1 + Math.sin(time * 12) * 0.1;
      mainDiya.flame.scale.z = 1 + Math.cos(time * 10) * 0.1;
      mainDiya.light.intensity = 2.5 + Math.sin(time * 15) * 0.5;

      const pos = sparkles.geometry.attributes.position.array;
      for (let i = 1; i < particleCount * 3; i += 3) {
        pos[i] -= 0.01;
        if (pos[i] < 0) pos[i] = 10;
      }
      sparkles.geometry.attributes.position.needsUpdate = true;

      for (let l = lanterns.length - 1; l >= 0; l--) {
        const lan = lanterns[l];
        lan.group.position.y += lan.speed;
        lan.group.position.x += Math.sin(time + lan.sway) * 0.005;
        if (lan.group.position.y > 15) {
          scene.remove(lan.group);
          lanterns.splice(l, 1);
        }
      }

      for (let f = fireworks.length - 1; f >= 0; f--) {
        const fw = fireworks[f];
        const positions = fw.system.geometry.attributes.position.array;
        fw.life -= 0.025;

        for (let i = 0; i < fw.vel.length; i++) {
          positions[i * 3] += fw.vel[i].x;
          positions[i * 3 + 1] += fw.vel[i].y - 0.002;
          positions[i * 3 + 2] += fw.vel[i].z;
        }
        fw.system.geometry.attributes.position.needsUpdate = true;
        fw.system.material.opacity = fw.life;

        if (fw.life <= 0) {
          scene.remove(fw.system);
          fireworks.splice(f, 1);
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    setInterval(triggerFireworks, 3000);
    animate();
  </script>
</body>
</html>
